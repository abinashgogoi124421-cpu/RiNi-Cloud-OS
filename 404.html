<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
        }
        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #1f6feb, #58a6ff);
            border-radius: 50%;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 4px;
        }
        .sub {
            color: #484f58;
            font-size: 14px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 32px;
            background: #1f6feb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }
        a:hover {
            background: #388bfd;
            transform: scale(1.02);
        }
        a:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <img src="https://cdn-icons-png.flaticon.com/512/3767/3767084.png" alt="Memory Bot">
        </div>
        <h1>Lost in Memory</h1>
        <p>This page doesn't exist in my memory banks.</p>
        <p class="sub">Maybe you took a wrong turn in the data stream?</p>
        <a href="/">⬅️ Go Home</a>
    </div>
</body>
</html>
