<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RiNi Cloud OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a78bfa">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Fredoka',sans-serif; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
.cartoon-card{border:3px solid #000; border-radius:24px; box-shadow:5px 5px 0 #000}
.cartoon-btn{border:3px solid #000; border-radius:16px; box-shadow:4px 4px 0 #000; font-weight:700}
.cartoon-btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 #000}
.bubble{border:2.5px solid #000; border-radius:20px}
body{overscroll-behavior:none; touch-action:manipulation}
#editor{user-select:text; -webkit-user-select:text}
#editor *{user-select:text; -webkit-user-select:text}
</style>
</head>
<body class="bg-[#fff7ed] max-w-[480px] mx-auto min-h-screen relative pb-28">
<!-- App Bar -->
<div class="bg-[#a78bfa] border-b-[3px] border-black p-4 sticky top-0 z-20">
  <div class="flex justify-between"><h1 class="text-[22px] font-bold">☁️ RiNi OS</h1><span class="bubble bg-white px-2 py-1 text-[10px] font-bold">AI CLOUD</span></div>
  <div class="mt-3 flex gap-2">
    <div class="flex-1 bg-white bubble p-2.5 flex gap-2 items-center"><span>🔍</span><input id="search" oninput="renderFiles()" placeholder="Search..." class="w-full outline-none text-sm bg-transparent"></div>
  </div>
</div>

<!-- Stats -->
<div class="grid grid-cols-3 gap-2 p-3">
  <div class="cartoon-card bg-[#86efac] p-2.5 text-center"><p id="totalFiles" class="font-bold text-lg">0</p><p class="text-[10px]">FILES</p></div>
  <div class="cartoon-card bg-[#fde047] p-2.5 text-center"><p id="totalSize" class="font-bold text-lg">0 MB</p><p class="text-[10px]">USED</p></div>
  <div class="cartoon-card bg-[#93c5fd] p-2.5 text-center"><p id="aiCount" class="font-bold text-lg">0</p><p class="text-[10px]">AI SORTED</p></div>
</div>

<!-- Chips -->
<div class="flex gap-2 overflow-x-auto px-3 pb-2" style="scrollbar-width:none">
  <button onclick="setFilter('All')" class="fbtn cartoon-btn bg-black text-white px-4 py-1.5 text-sm">All ✨</button>
  <button onclick="setFilter('Bills')" class="fbtn cartoon-btn bg-white px-4 py-1.5 text-sm">🧾Bills</button>
  <button onclick="setFilter('IDs')" class="fbtn cartoon-btn bg-white px-4 py-1.5 text-sm">🪪IDs</button>
  <button onclick="setFilter('Photos')" class="fbtn cartoon-btn bg-white px-4 py-1.5 text-sm">🖼️Photos</button>
  <button onclick="setFilter('Docs')" class="fbtn cartoon-btn bg-white px-4 py-1.5 text-sm">📄Docs</button>
  <button onclick="setFilter('Apps')" class="fbtn cartoon-btn bg-white px-4 py-1.5 text-sm">📦Apps</button>
</div>

<!-- Grid -->
<div id="grid" class="px-3 grid grid-cols-2 gap-2.5"></div>

<!-- TEXT EDITOR MODAL -->
<div id="editorModal" class="fixed inset-0 bg-black/50 z-50 hidden flex-col">
  <div class="bg-[#fff7ed] h-full flex flex-col">
    <div class="bg-[#a78bfa] border-b-[3px] border-black p-3 flex justify-between items-center">
      <p class="font-bold" id="editFileName">editor.txt</p>
      <button onclick="closeEditor()" class="cartoon-btn bg-white px-3 py-1 text-sm">X</button>
    </div>
    <textarea id="editor" class="flex-1 p-4 outline-none text-sm bg-white m-3 bubble" placeholder="Type here..."></textarea>
    <!-- AI Tools -->
    <div class="p-3 grid grid-cols-2 gap-2">
      <button onclick="aiEdit('fix grammar and format this text professionally')" class="cartoon-btn bg-[#86efac] py-2 text-sm">✨ Fix & Format</button>
      <button onclick="aiEdit('summarize this text in short points')" class="cartoon-btn bg-[#93c5fd] py-2 text-sm">📝 Summarize</button>
      <button onclick="aiEdit('translate this to proper English')" class="cartoon-btn bg-[#fde047] py-2 text-sm">🌐 Translate</button>
      <button onclick="aiEdit('make this longer and more detailed')" class="cartoon-btn bg-[#fca5a5] py-2 text-sm">📖 Expand</button>
    </div>
    <div class="p-3 flex gap-2">
      <button onclick="saveTextFile()" class="flex-1 cartoon-btn bg-black text-white py-3">💾 Save to Cloud</button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t-[3px] border-black flex justify-around items-center p-2">
  <button class="text-center"><div class="text-xl">🏠</div><div class="text-[9px] font-bold">HOME</div></button>
  <button onclick="createNewText()" class="cartoon-btn bg-[#fde047] px-3 py-1 text-xs">+ NEW TXT</button>
  <button onclick="document.getElementById('fileInput').click()" class="cartoon-btn bg-[#a78bfa] w-14 h-14 rounded-full text-2xl -mt-8">+</button>
  <button onclick="createNewText()" class="text-center"><div class="text-xl">📝</div><div class="text-[9px] font-bold">EDITOR</div></button>
  <button onclick="restoreIndex()" class="text-center"><div class="text-xl">♻️</div><div class="text-[9px] font-bold">RECOVERY</div></button>
</div>

<input type="file" id="fileInput" hidden multiple onchange="handleFiles(this.files)">

<script>
const BOT_TOKEN="8835604359:AAFDVBTEXWb7lwQsSMynshd3HNoOM8dG-3E";
const CHANNEL_ID="-1003953146702";
let FILES=JSON.parse(localStorage.getItem('rini_files')||'[]');
let FILTER='All'; let EDITING_ID=null;

function saveIndex(){localStorage.setItem('rini_files',JSON.stringify(FILES));updateStats();}
function updateStats(){let s=FILES.reduce((a,b)=>a+b.size,0)/1024/1024;document.getElementById('totalFiles').innerText=FILES.length;document.getElementById('totalSize').innerText=s.toFixed(1)+' MB';document.getElementById('aiCount').innerText=FILES.filter(f=>f.folder!=='Other').length;}

async function aiClassify(n){try{const r=await puter.ai.chat(`Classify "${n}" ONE word: Bills,IDs,Photos,Docs,Apps,Memes,Other`,{model:'mistral'});let f=r.message.content.trim().replace(/[^a-zA-Z]/g,'');return ['Bills','IDs','Photos','Docs','Apps','Memes'].includes(f)?f:'Other';}catch{return 'Other';}}
async function uploadToTelegram(file,folder){if(BOT_TOKEN==="YOUR_BOT_TOKEN")return{file_id:'demo_'+Date.now()};let fd=new FormData();fd.append('chat_id',CHANNEL_ID);fd.append('document',file);fd.append('caption',`📁 /RiNi/${folder}/ | ${file.name}`);let res=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`,{method:'POST',body:fd});let d=await res.json();if(!d.ok)throw Error(d.description);return d.result.document;}

async function handleFiles(list){for(let file of list){let folder=await aiClassify(file.name);try{let tg=await uploadToTelegram(file,folder);FILES.unshift({id:Date.now()+Math.random(),name:file.name,size:file.size,folder,file_id:tg.file_id,date:new Date().toISOString(),text: file.type.includes('text')?await file.text():''});saveIndex();renderFiles();}catch(e){alert(e.message);}}}

function setFilter(f){FILTER=f; renderFiles();}

function renderFiles(){
  let q=document.getElementById('search').value.toLowerCase();
  let list=FILES.filter(f=>(FILTER==='All'||f.folder===FILTER)&&f.name.toLowerCase().includes(q));
  document.getElementById('grid').innerHTML=list.map(f=>{
    let isTxt=f.name.endsWith('.txt')||f.name.endsWith('.md')||f.name.endsWith('.json')||f.type?.includes('text')||f.text;
    return `<div class="cartoon-card bg-white p-3">
      <span class="bubble bg-[#fde047] text-[9px] px-2 py-0.5 font-bold">${f.folder}</span>
      <p class="font-bold text-[13px] mt-2 truncate">${f.name}</p>
      <div class="flex gap-1 mt-2">
        ${isTxt?`<button onclick="openEditor('${f.id}')" class="cartoon-btn bg-[#86efac] flex-1 text-[11px] py-1">EDIT</button>`:`<button onclick="downloadFile('${f.file_id}')" class="cartoon-btn bg-black text-white flex-1 text-[11px] py-1">OPEN</button>`}
        <button onclick="deleteFile('${f.id}')" class="cartoon-btn bg-[#fca5a5] w-8 text-[11px] py-1">X</button>
      </div>
    </div>`;
  }).join('') || '<p class="col-span-2 text-center p-12 opacity-50">No files yet 🥺<br>Tap + to backup</p>';
}

// TEXT EDITOR LOGIC
function createNewText(){
  EDITING_ID=null;
  document.getElementById('editFileName').innerText='new-note.txt';
  document.getElementById('editor').value='';
  document.getElementById('editorModal').classList.remove('hidden');
  document.getElementById('editorModal').classList.add('flex');
}
function openEditor(id){
  let f=FILES.find(x=>x.id==id);
  EDITING_ID=id;
  document.getElementById('editFileName').innerText=f.name;
  document.getElementById('editor').value=f.text||'';
  document.getElementById('editorModal').classList.remove('hidden');
  document.getElementById('editorModal').classList.add('flex');
}
function closeEditor(){document.getElementById('editorModal').classList.add('hidden');}
async function aiEdit(prompt){
  let editor=document.getElementById('editor');
  if(!editor.value.trim()){alert('Write something first!');return;}
  editor.value='🤖 AI thinking...';
  try{
    let r=await puter.ai.chat(`${prompt}:\n\n${document.getElementById('editor').value}`,{model:'mistral'});
    editor.value=r.message.content;
  }catch(e){editor.value='AI failed: '+e.message;}
}
async function saveTextFile(){
  let content=document.getElementById('editor').value;
  let name=document.getElementById('editFileName').innerText;
  let blob=new Blob([content],{type:'text/plain'});
  let file=new File([blob],name,{type:'text/plain'});
  if(EDITING_ID){FILES=FILES.filter(f=>f.id!=EDITING_ID);}
  await handleFiles([file]);
  closeEditor();
}

async function downloadFile(id){if(id.startsWith('demo_')){alert('Set BOT_TOKEN');return;}let r=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${id}`);let d=await r.json();if(d.ok)window.open(`https://api.telegram.org/file/bot${BOT_TOKEN}/${d.result.file_path}`);}
function deleteFile(id){if(!confirm('Delete?'))return;FILES=FILES.filter(f=>f.id!=id);saveIndex();renderFiles();}
function restoreIndex(){alert('Recovery done from local');}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
updateStats();renderFiles();

// Disable context menu & selection (Android)
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
