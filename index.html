<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RiNi Cloud OS - Cartoon</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a78bfa">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Fredoka',sans-serif}
.cartoon-card{border:3px solid #000; border-radius:24px; box-shadow:6px 6px 0 #000; transition:.2s}
.cartoon-card:active{transform:translate(3px,3px); box-shadow:3px 3px 0 #000}
.cartoon-btn{border:3px solid #000; border-radius:16px; box-shadow:4px 4px 0 #000; font-weight:700}
.cartoon-btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 #000}
.bubble{border:2.5px solid #000; border-radius:20px}
</style>
</head>
<body class="bg-[#fff7ed] pb-24">
<!-- Top App Bar -->
<div class="bg-[#a78bfa] border-b-[3px] border-black p-4 sticky top-0 z-10">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">☁️ RiNi OS</h1>
    <div class="bg-white bubble px-3 py-1 text-xs font-bold">-1003953146702</div>
  </div>
  <div class="flex gap-2 mt-3">
    <div class="flex-1 bg-white bubble p-2 flex items-center gap-2"><span>🔍</span><input id="search" oninput="renderFiles()" placeholder="Search kawaii files..." class="w-full outline-none text-sm"></div>
    <button onclick="document.getElementById('fileInput').click()" class="cartoon-btn bg-[#fde047] px-4">+ Backup</button>
  </div>
</div>

<!-- Stats - Cartoon -->
<div class="grid grid-cols-3 gap-3 p-4">
  <div class="cartoon-card bg-[#86efac] p-3 text-center"><p class="text-xs">Files</p><p id="totalFiles" class="text-xl font-bold">0</p><p class="text-[10px]">📦</p></div>
  <div class="cartoon-card bg-[#fca5a5] p-3 text-center"><p class="text-xs">Used</p><p id="totalSize" class="text-xl font-bold">0 MB</p><p class="text-[10px]">💾</p></div>
  <div class="cartoon-card bg-[#93c5fd] p-3 text-center"><p class="text-xs">AI Sorted</p><p id="aiCount" class="text-xl font-bold">0</p><p class="text-[10px]">🤖</p></div>
</div>

<!-- Drop Zone Cartoon -->
<div id="drop" class="mx-4 cartoon-card bg-white border-dashed p-6 text-center">
  <p class="text-4xl">📤</p>
  <p class="font-bold">Drop files here!</p>
  <p class="text-xs text-gray-500">Unlim shares → AI organizes auto</p>
  <p class="text-[10px] mt-1 bg-[#fde047] inline-block bubble px-2">Puter AI + Telegram</p>
</div>

<!-- Folder Chips -->
<div class="flex gap-2 overflow-x-auto p-4 no-scrollbar">
  <button onclick="setFilter('All')" class="filter-btn cartoon-btn bg-black text-white px-4 py-1 whitespace-nowrap">All ✨</button>
  <button onclick="setFilter('Bills')" class="filter-btn cartoon-btn bg-white px-4 py-1 whitespace-nowrap">🧾 Bills</button>
  <button onclick="setFilter('IDs')" class="filter-btn cartoon-btn bg-white px-4 py-1 whitespace-nowrap">🪪 IDs</button>
  <button onclick="setFilter('Photos')" class="filter-btn cartoon-btn bg-white px-4 py-1 whitespace-nowrap">🖼️ Photos</button>
  <button onclick="setFilter('Docs')" class="filter-btn cartoon-btn bg-white px-4 py-1 whitespace-nowrap">📄 Docs</button>
  <button onclick="setFilter('Apps')" class="filter-btn cartoon-btn bg-white px-4 py-1 whitespace-nowrap">📦 Apps</button>
</div>

<!-- File Grid -->
<div id="grid" class="px-4 grid grid-cols-2 gap-3"></div>

<!-- Bottom Nav - Android Style -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t-[3px] border-black flex justify-around p-2 pb-4">
  <button class="flex flex-col items-center"><span class="text-xl">🏠</span><span class="text-[10px] font-bold">Home</span></button>
  <button onclick="document.getElementById('fileInput').click()" class="cartoon-btn bg-[#a78bfa] w-14 h-14 rounded-full text-2xl -mt-6">+</button>
  <button onclick="restoreIndex()" class="flex flex-col items-center"><span class="text-xl">♻️</span><span class="text-[10px] font-bold">Recovery</span></button>
</div>

<input type="file" id="fileInput" hidden multiple onchange="handleFiles(this.files)">

<script>
const BOT_TOKEN = "8835604359:AAFDVBTEXWb7lwQsSMynshd3HNoOM8dG-3E";
const CHANNEL_ID = "-1003953146702";
let FILES = JSON.parse(localStorage.getItem('rini_files')||'[]');
let FILTER='All';

function saveIndex(){localStorage.setItem('rini_files',JSON.stringify(FILES));updateStats();}
function updateStats(){let s=FILES.reduce((a,b)=>a+b.size,0)/1024/1024;document.getElementById('totalFiles').innerText=FILES.length;document.getElementById('totalSize').innerText=s.toFixed(1)+' MB';document.getElementById('aiCount').innerText=FILES.filter(f=>f.folder!=='Other').length;}

async function aiClassify(name){
  try{
    const r = await puter.ai.chat(`Classify "${name}" into ONE: Bills, IDs, Photos, Docs, Apps, Memes, Other. Only word.`,{model:'mistral'});
    let f=r.message.content.trim().replace(/[^a-zA-Z]/g,'');
    return ['Bills','IDs','Photos','Docs','Apps','Memes'].includes(f)?f:'Other';
  }catch{return 'Other';}
}

async function uploadToTelegram(file,folder){
  if(BOT_TOKEN==="YOUR_BOT_TOKEN") return {file_id:'demo_'+Date.now()};
  let fd=new FormData(); fd.append('chat_id',CHANNEL_ID); fd.append('document',file);
  fd.append('caption',`📁 /RiNi/${folder}/ | ${file.name}`);
  let res=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`,{method:'POST',body:fd});
  let d=await res.json(); if(!d.ok) throw Error(d.description); return d.result.document;
}

async function handleFiles(list){
  for(let file of list){
    let temp=document.createElement('div'); temp.className='cartoon-card bg-yellow-100 p-3'; temp.innerText='🤖 AI thinking: '+file.name;
    document.getElementById('grid').prepend(temp);
    let folder=await aiClassify(file.name);
    try{let tg=await uploadToTelegram(file,folder);
      FILES.unshift({id:Date.now()+Math.random(),name:file.name,size:file.size,folder,file_id:tg.file_id,date:new Date().toISOString()});
      saveIndex(); renderFiles();
    }catch(e){alert(e.message);} temp.remove();
  }
}

function setFilter(f){FILTER=f; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('bg-black','text-white')); event.target.classList.add('bg-black','text-white'); renderFiles();}

function renderFiles(){
  let q=document.getElementById('search').value.toLowerCase();
  let list=FILES.filter(f=>(FILTER==='All'||f.folder===FILTER)&&f.name.toLowerCase().includes(q));
  document.getElementById('grid').innerHTML=list.map(f=>`
    <div class="cartoon-card bg-white p-3">
      <div class="flex justify-between"><span class="text-[10px] bubble bg-[#fde047] px-2">${f.folder}</span><span class="text-[10px]">${(f.size/1024).toFixed(0)}KB</span></div>
      <p class="font-bold text-sm mt-2 truncate">📄 ${f.name}</p>
      <div class="flex gap-1 mt-3">
        <button onclick="downloadFile('${f.file_id}')" class="cartoon-btn bg-black text-white flex-1 text-xs py-1">OPEN</button>
        <button onclick="deleteFile('${f.id}')" class="cartoon-btn bg-[#fca5a5] flex-1 text-xs py-1">DEL</button>
      </div>
    </div>`).join('') || '<p class="col-span-2 text-center p-10">No files yet 🥺<br>Upload to backup!</p>';
}

async function downloadFile(id){if(id.startsWith('demo_')){alert('Set BOT_TOKEN first!');return;}let r=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${id}`);let d=await r.json();if(d.ok)window.open(`https://api.telegram.org/file/bot${BOT_TOKEN}/${d.result.file_path}`);}
function deleteFile(id){if(!confirm('Delete this?'))return;FILES=FILES.filter(f=>f.id!=id);saveIndex();renderFiles();}
function restoreIndex(){alert('♻️ Recovery from localStorage + Telegram channel');}

const drop=document.getElementById('drop');
drop.addEventListener('dragover',e=>e.preventDefault());
drop.addEventListener('drop',e=>{e.preventDefault();handleFiles(e.dataTransfer.files);});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
updateStats();renderFiles();
</script>
</body>
</html>
