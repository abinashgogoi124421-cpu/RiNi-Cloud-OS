<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Memory Bot">
    <meta name="application-name" content="AI Memory Bot">
    <meta name="description" content="AI Memory Bot with unlimited Telegram storage">
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    
    <!-- PWA Installation -->
    <link rel="mask-icon" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png" color="#1f6feb">
    
    <title>AI Memory Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/puter.js"></script>
    
    <style>
        /* === RESET & BASE === */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            touch-action: pan-y;
        }

        /* === APP CONTAINER === */
        .app {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            position: relative;
        }

        /* === HEADER === */
        .header {
            padding: 16px 20px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            overflow: hidden;
        }

        .header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8b949e;
        }

        .header-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2ea043;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .header-actions button {
            background: none;
            border: none;
            color: #8b949e;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            border-radius: 6px;
        }

        .header-actions button:hover {
            color: #e6edf3;
            background: #30363d;
        }

        /* === CHAT AREA === */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 2px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* === MESSAGES === */
        .message {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 12px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            transition: all 0.25s ease;
            touch-action: pan-y;
            cursor: default;
            word-wrap: break-word;
        }

        .message.user {
            background: #1c2333;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid #30363d;
        }

        .message.ai {
            background: #161b22;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #30363d;
        }

        .message.system {
            background: transparent;
            align-self: center;
            color: #8b949e;
            font-size: 12px;
            padding: 4px 12px;
            border: none;
        }

        .message .timestamp {
            font-size: 10px;
            color: #484f58;
            margin-top: 4px;
            text-align: right;
        }

        .message-content {
            line-height: 1.6;
        }

        .message-content strong { color: #58a6ff; }
        .message-content em { color: #f0883e; }
        .message-content del { color: #f85149; text-decoration: line-through; }
        .message-content code {
            background: #0d1117;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #f0883e;
        }
        .message-content pre {
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid #30363d;
        }
        .message-content pre code {
            background: none;
            padding: 0;
            color: #e6edf3;
        }
        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 13px;
        }
        .message-content th, .message-content td {
            border: 1px solid #30363d;
            padding: 6px 10px;
            text-align: left;
        }
        .message-content th {
            background: #161b22;
            color: #58a6ff;
        }
        .message-content ul, .message-content ol {
            padding-left: 20px;
            margin: 4px 0;
        }

        /* === FILE MESSAGES === */
        .file-message {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            cursor: pointer;
            max-width: 100%;
        }

        .file-message:hover {
            border-color: #58a6ff;
            background: #1c2333;
        }

        .file-icon {
            font-size: 28px;
            width: 40px;
            text-align: center;
        }
        .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-name {
            font-size: 14px;
            color: #e6edf3;
            font-weight: 500;
            word-break: break-all;
        }
        .file-meta {
            font-size: 11px;
            color: #8b949e;
            display: flex;
            gap: 12px;
            margin-top: 2px;
        }
        .file-actions {
            display: flex;
            gap: 6px;
        }
        .file-actions button {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .file-actions button:hover {
            color: #e6edf3;
            background: #30363d;
        }
        .file-actions button.delete:hover {
            color: #f85149;
        }

        /* === INPUT AREA === */
        .input-area {
            padding: 12px 16px 16px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #30363d;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 4px;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .input-wrapper textarea {
            flex: 1;
            background: none;
            border: none;
            padding: 8px 12px;
            color: #e6edf3;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 20px;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder {
            color: #484f58;
        }

        .input-actions {
            display: flex;
            gap: 4px;
            padding: 4px;
        }

        .input-actions button {
            background: none;
            border: none;
            color: #8b949e;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .input-actions button:hover {
            color: #e6edf3;
            background: #30363d;
        }

        .input-actions button.send {
            background: #1f6feb;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
        }

        .input-actions button.send:hover {
            background: #388bfd;
            transform: scale(1.02);
        }

        .input-actions button.send:active {
            transform: scale(0.95);
        }

        /* === TYPING INDICATOR === */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            gap: 4px;
            margin: 4px 0;
        }

        .typing-indicator .dot {
            width: 6px;
            height: 6px;
            background: #8b949e;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* === ANIMATIONS === */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; max-height: 500px; margin: 8px 0; }
            to { transform: translateX(-100%); opacity: 0; max-height: 0; margin: 0; padding: 0; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; max-height: 500px; margin: 8px 0; }
            to { transform: translateX(100%); opacity: 0; max-height: 0; margin: 0; padding: 0; }
        }

        .message.swipe-left {
            animation: slideOutLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message.swipe-right {
            animation: slideOutRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* === RESPONSIVE === */
        @media (max-width: 600px) {
            .message { max-width: 92%; }
            .header h1 { font-size: 15px; }
            .header .avatar { width: 30px; height: 30px; font-size: 14px; }
        }

        @media (min-width: 768px) {
            .app { max-width: 600px; margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,0.8); }
        }

        /* === INSTALL BUTTON === */
        #installBtn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f6feb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(31, 111, 235, 0.4);
            display: none;
        }

        #installBtn.show {
            display: block;
            animation: pulse 2s infinite;
        }

        /* === FILE DROP ZONE === */
        .file-drop-zone {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 1000;
            border: 2px dashed #30363d;
            margin: 20px;
            border-radius: 20px;
        }

        .file-drop-zone.active {
            display: flex;
        }

        .file-drop-zone .icon {
            font-size: 64px;
        }
        .file-drop-zone .text {
            font-size: 20px;
            color: #8b949e;
        }
        .file-drop-zone .sub {
            font-size: 14px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <!-- === APP === -->
    <div class="app" id="app">
        
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="avatar">
                    <img src="https://cdn-icons-png.flaticon.com/512/3767/3767084.png" alt="Memory Bot">
                </div>
                <div>
                    <h1>Memory Bot</h1>
                    <div class="header-status">
                        <span class="dot"></span>
                        <span>Online</span>
                        <span style="margin-left: 8px; color: #484f58;">•</span>
                        <span id="storageCount" style="color: #484f58;">0 files</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="refreshStorage()" title="Refresh storage">🔄</button>
                <button onclick="clearChat()" title="Clear chat">🗑️</button>
                <button onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- Messages will appear here -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Ask me anything..." 
                          onkeydown="handleInputKeydown(event)"></textarea>
                <div class="input-actions">
                    <button onclick="document.getElementById('fileInput').click()" title="Upload file">📎</button>
                    <button onclick="sendMessage()" class="send">➤</button>
                </div>
            </div>
        </div>

        <!-- Hidden file input -->
        <input type="file" id="fileInput" style="display:none" multiple 
               onchange="handleFiles(this.files)">

        <!-- File drop zone -->
        <div class="file-drop-zone" id="fileDropZone">
            <div class="icon">📁</div>
            <div class="text">Drop files here</div>
            <div class="sub">or click to browse</div>
        </div>
    </div>

    <script>
        // ============================================
        //  COMPLETE BOT IMPLEMENTATION
        // ============================================

        // === CONFIGURATION ===
        const CONFIG = {
            telegram: {
                channelId: '-1003953146702',
                botToken: '8835604359:AAFDVBTEXWb7lwQsSMynshd3HNoOM8dG-3E',
                baseUrl: 'https://api.telegram.org/bot8835604359:AAFDVBTEXWb7lwQsSMynshd3HNoOM8dG-3E'
            }
        };

        // === STATE ===
        let state = {
            userId: localStorage.getItem('memory_bot_user') || `user_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
            messages: [],
            files: [],
            isProcessing: false,
            messageCounter: 0
        };

        localStorage.setItem('memory_bot_user', state.userId);

        // === TELEGRAM STORAGE CLASS ===
        class TelegramStorage {
            constructor() {
                this.channelId = CONFIG.telegram.channelId;
                this.baseUrl = CONFIG.telegram.baseUrl;
                this.userId = state.userId;
            }

            async sendMessage(text) {
                try {
                    const response = await fetch(`${this.baseUrl}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: this.channelId,
                            text: text,
                            parse_mode: 'HTML'
                        })
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Send error:', error);
                    return null;
                }
            }

            async deleteMessage(messageId) {
                try {
                    const response = await fetch(`${this.baseUrl}/deleteMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: this.channelId,
                            message_id: parseInt(messageId)
                        })
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Delete error:', error);
                    return null;
                }
            }

            async getMessages() {
                try {
                    const response = await fetch(`${this.baseUrl}/getUpdates`, {
                        method: 'GET'
                    });
                    const data = await response.json();
                    return data.result || [];
                } catch (error) {
                    console.error('Get messages error:', error);
                    return [];
                }
            }

            async storeMemory(data) {
                const encrypted = await this.encrypt(data);
                const message = await this.sendMessage(
                    `📝 MEMORY_${this.userId}_${Date.now()}\n${encrypted}`
                );
                return message?.result?.message_id;
            }

            async storeFile(file, content) {
                const isText = this.isTextFile(file.name);
                const storedContent = isText ? content : await this.fileToBase64(content);
                
                const message = await this.sendMessage(
                    `📁 FILE_${this.userId}_${file.name}_${Date.now()}\n` +
                    `TYPE:${file.name.split('.').pop()}\n` +
                    `TEXT:${isText}\n` +
                    `SIZE:${file.size}\n` +
                    `\n${storedContent}`
                );
                return message?.result?.message_id;
            }

            async getUserData() {
                const messages = await this.getMessages();
                const userData = messages.filter(msg => {
                    const text = msg.message?.text || '';
                    return text.includes(`_${this.userId}_`);
                });
                return userData;
            }

            isTextFile(filename) {
                const textExtensions = ['txt', 'json', 'csv', 'md', 'xml', 'html', 'css', 'js', 'py', 'java', 'cpp', 'c', 'rb', 'go', 'rs', 'swift', 'kt', 'php', 'sh'];
                const ext = filename.split('.').pop().toLowerCase();
                return textExtensions.includes(ext);
            }

            async encrypt(data) {
                const str = typeof data === 'string' ? data : JSON.stringify(data);
                let encrypted = '';
                for (let i = 0; i < str.length; i++) {
                    encrypted += String.fromCharCode(str.charCodeAt(i) ^ this.userId.length);
                }
                return btoa(encrypted);
            }

            async decrypt(encrypted) {
                try {
                    const decoded = atob(encrypted);
                    let decrypted = '';
                    for (let i = 0; i < decoded.length; i++) {
                        decrypted += String.fromCharCode(decoded.charCodeAt(i) ^ this.userId.length);
                    }
                    return decrypted;
                } catch {
                    return encrypted;
                }
            }

            async fileToBase64(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = () => resolve('');
                    reader.readAsDataURL(file);
                });
            }
        }

        const storage = new TelegramStorage();

        // === UI HELPERS ===
        function addMessage(type, content, metadata = {}) {
            const area = document.getElementById('chatArea');
            const messageId = ++state.messageCounter;
            
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.dataset.messageId = messageId;
            div.dataset.telegramId = metadata.telegramId || '';

            // Format content
            let formattedContent = content;
            if (type === 'ai' || type === 'user') {
                formattedContent = formatText(content);
            }

            div.innerHTML = `
                <div class="message-content">${formattedContent}</div>
                ${metadata.file ? `
                    <div class="file-message" style="margin-top:8px">
                        <span class="file-icon">${metadata.file.icon || '📄'}</span>
                        <div class="file-info">
                            <div class="file-name">${metadata.file.name}</div>
                            <div class="file-meta">
                                <span>${metadata.file.size || 'Unknown'}</span>
                                <span>${metadata.file.type || 'File'}</span>
                            </div>
                        </div>
                        <div class="file-actions">
                            <button onclick="downloadFile('${metadata.file.name}')">⬇️</button>
                            <button class="delete" onclick="deleteFilePermanent('${metadata.file.name}')">🗑️</button>
                        </div>
                    </div>
                ` : ''}
                ${metadata.timestamp ? `<div class="timestamp">${metadata.timestamp}</div>` : ''}
            `;

            // Swipe handlers
            let startX = 0, startY = 0;
            let isSwiping = false;

            div.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isSwiping = false;
            });

            div.addEventListener('touchmove', (e) => {
                const deltaX = e.touches[0].clientX - startX;
                const deltaY = e.touches[0].clientY - startY;
                
                if (Math.abs(deltaY) > 20) return;
                if (Math.abs(deltaX) < 10) return;
                
                isSwiping = true;
                e.preventDefault();

                const progress = Math.min(Math.abs(deltaX) / 100, 1);
                div.style.transform = `translateX(${deltaX}px)`;
                div.style.opacity = 1 - progress * 0.5;
                
                if (deltaX < -30) {
                    div.style.borderLeft = `3px solid #f85149`;
                } else if (deltaX > 30) {
                    div.style.borderRight = `3px solid #f0883e`;
                } else {
                    div.style.border = '1px solid #30363d';
                }
            });

            div.addEventListener('touchend', (e) => {
                const deltaX = e.changedTouches[0].clientX - startX;
                
                if (!isSwiping) {
                    return;
                }

                if (deltaX < -60) {
                    deleteMessageLocal(div);
                } else if (deltaX > 60) {
                    deleteMessagePermanent(div);
                } else {
                    div.style.transform = '';
                    div.style.opacity = '';
                    div.style.border = '';
                }
            });

            // Mouse support
            let mouseDown = false;
            let mouseStartX = 0;

            div.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    mouseDown = true;
                    mouseStartX = e.clientX;
                }
            });

            div.addEventListener('mousemove', (e) => {
                if (!mouseDown) return;
                const deltaX = e.clientX - mouseStartX;
                if (Math.abs(deltaX) > 10) {
                    div.style.transform = `translateX(${deltaX}px)`;
                    div.style.opacity = 1 - Math.min(Math.abs(deltaX) / 100, 0.5);
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (!mouseDown) return;
                mouseDown = false;
                const deltaX = e.clientX - mouseStartX;
                
                if (deltaX < -60) {
                    deleteMessageLocal(div);
                } else if (deltaX > 60) {
                    deleteMessagePermanent(div);
                } else {
                    div.style.transform = '';
                    div.style.opacity = '';
                }
            });

            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            
            state.messages.push({ id: messageId, type, content, metadata });
            return div;
        }

        function formatText(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            text = text.replace(/~~(.*?)~~/g, '<del>$1</del>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            text = text.replace(/\|(.+)\|/g, (match) => {
                const cells = match.split('|').filter(c => c.trim());
                return `<table><tr>${cells.map(c => `<td>${c.trim()}</td>`).join('')}</tr></table>`;
            });
            text = text.replace(/^- (.*?)$/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*?<\/li>)/gs, (match) => {
                return `<ul>${match}</ul>`;
            });
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.textContent = text;
            document.getElementById('chatArea').appendChild(div);
        }

        // === DELETE FUNCTIONS ===
        function deleteMessageLocal(element) {
            element.classList.add('swipe-left');
            setTimeout(() => {
                element.remove();
                const id = parseInt(element.dataset.messageId);
                state.messages = state.messages.filter(m => m.id !== id);
            }, 350);
        }

        async function deleteMessagePermanent(element) {
            const telegramId = element.dataset.telegramId;
            if (telegramId) {
                await storage.deleteMessage(telegramId);
                addSystemMessage('🗑️ Message deleted from Telegram permanently');
            }
            element.classList.add('swipe-right');
            setTimeout(() => {
                element.remove();
                const id = parseInt(element.dataset.messageId);
                state.messages = state.messages.filter(m => m.id !== id);
            }, 350);
        }

        async function deleteFilePermanent(filename) {
            if (!confirm(`Delete "${filename}" permanently from Telegram?`)) return;
            
            const files = await storage.getUserData();
            for (const msg of files) {
                const text = msg.message?.text || '';
                if (text.includes(filename) && text.includes('FILE_')) {
                    await storage.deleteMessage(msg.message.message_id);
                }
            }
            
            addSystemMessage(`🗑️ Deleted "${filename}" from storage`);
            refreshStorage();
        }

        // === FILE HANDLING ===
        async function handleFiles(files) {
            for (const file of files) {
                const isText = storage.isTextFile(file.name);
                let content = file;
                
                if (isText) {
                    content = await file.text();
                }

                const messageId = await storage.storeFile(file, content);
                
                const fileMeta = {
                    name: file.name,
                    size: (file.size / 1024).toFixed(1) + ' KB',
                    type: isText ? '📝 Text' : '📎 Binary',
                    icon: isText ? '📄' : '📎'
                };

                addMessage('system', '📁 File uploaded:', {
                    file: fileMeta,
                    telegramId: messageId,
                    timestamp: new Date().toLocaleTimeString()
                });

                if (isText) {
                    addSystemMessage(`📖 AI is reading "${file.name}"...`);
                    await sendMessageToAI(`I've uploaded a file named "${file.name}". Here's its content:\n\n${content}\n\nPlease remember this.`);
                }
            }

            refreshStorage();
        }

        // === DOWNLOAD FILE ===
        async function downloadFile(filename) {
            addSystemMessage(`⏳ Downloading "${filename}"...`);
            
            const files = await storage.getUserData();
            for (const msg of files) {
                const text = msg.message?.text || '';
                if (text.includes(filename) && text.includes('FILE_')) {
                    const lines = text.split('\n');
                    const contentStart = lines.findIndex(l => l.trim() === '');
                    if (contentStart !== -1) {
                        const content = lines.slice(contentStart + 1).join('\n');
                        const isText = text.includes('TEXT:true');
                        
                        if (isText) {
                            const blob = new Blob([content], { type: 'text/plain' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            a.click();
                            URL.revokeObjectURL(url);
                            addSystemMessage(`✅ Downloaded "${filename}"`);
                        } else {
                            try {
                                const binary = atob(content);
                                const byteArray = new Uint8Array(binary.length);
                                for (let i = 0; i < binary.length; i++) {
                                    byteArray[i] = binary.charCodeAt(i);
                                }
                                const blob = new Blob([byteArray]);
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = filename;
                                a.click();
                                URL.revokeObjectURL(url);
                                addSystemMessage(`✅ Downloaded "${filename}"`);
                            } catch (e) {
                                addSystemMessage(`❌ Could not download "${filename}"`);
                            }
                        }
                        return;
                    }
                }
            }
            addSystemMessage(`❌ File "${filename}" not found`);
        }

        // === AI COMMUNICATION ===
        async function sendMessageToAI(message) {
            if (state.isProcessing) return;
            state.isProcessing = true;

            document.getElementById('typingIndicator').style.display = 'flex';
            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;

            try {
                const response = await puter.ai.chat(message, {
                    model: 'gpt-4o-mini'
                });

                await storage.storeMemory({
                    user: state.userId,
                    message: message,
                    response: response,
                    timestamp: new Date().toISOString()
                });

                addMessage('ai', response, {
                    timestamp: new Date().toLocaleTimeString()
                });

            } catch (error) {
                addMessage('system', `❌ Error: ${error.message}`);
            } finally {
                state.isProcessing = false;
                document.getElementById('typingIndicator').style.display = 'none';
                document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
            }
        }

        // === SEND MESSAGE ===
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            addMessage('user', text, {
                timestamp: new Date().toLocaleTimeString()
            });
            
            input.value = '';
            input.style.height = 'auto';
            
            const fileMatch = text.match(/give me (?:the file |)(.+?)(?:\.|$)/i);
            if (fileMatch && text.toLowerCase().includes('file')) {
                await downloadFile(fileMatch[1].trim());
                return;
            }
            
            if (text.toLowerCase().includes('list files') || text.toLowerCase().includes('show files')) {
                await refreshStorage();
                return;
            }
            
            await sendMessageToAI(text);
        }

        // === INPUT HANDLING ===
        function handleInputKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // === REFRESH STORAGE ===
        async function refreshStorage() {
            addSystemMessage('🔄 Refreshing storage...');
            
            try {
                const data = await storage.getUserData();
                const fileCount = data.filter(msg => 
                    msg.message?.text?.includes('FILE_')
                ).length;
                
                document.getElementById('storageCount').textContent = `${fileCount} files`;
                addSystemMessage(`📊 Storage: ${fileCount} files in Telegram`);
                
                if (fileCount > 0) {
                    const fileNames = data
                        .filter(msg => msg.message?.text?.includes('FILE_'))
                        .map(msg => {
                            const match = msg.message.text.match(/FILE_.+?_(.+?)_/);
                            return match ? match[1] : null;
                        })
                        .filter(Boolean);
                    
                    if (fileNames.length > 0) {
                        const uniqueFiles = [...new Set(fileNames)];
                        addSystemMessage(`📁 Files: ${uniqueFiles.join(', ')}`);
                    }
                }
            } catch (error) {
                addSystemMessage(`❌ Error refreshing: ${error.message}`);
            }
        }

        // === CLEAR CHAT ===
        function clearChat() {
            if (!confirm('Clear chat messages (not storage)?')) return;
            document.getElementById('chatArea').innerHTML = '';
            state.messages = [];
            addSystemMessage('🧹 Chat cleared');
        }

        // === THEME TOGGLE ===
        function toggleTheme() {
            const isDark = document.body.style.background !== '#f0f6fc';
            document.body.style.background = isDark ? '#f0f6fc' : '#0d1117';
            document.body.style.color = isDark ? '#24292f' : '#e6edf3';
            document.querySelector('.app').style.background = isDark ? '#f6f8fa' : '#0d1117';
            document.querySelector('.header').style.background = isDark ? 'rgba(246,248,250,0.95)' : 'rgba(22,27,34,0.95)';
            document.querySelector('.input-area').style.background = isDark ? 'rgba(246,248,250,0.95)' : 'rgba(22,27,34,0.95)';
        }

        // === DRAG AND DROP ===
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('fileDropZone').classList.add('active');
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            document.getElementById('fileDropZone').classList.remove('active');
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('fileDropZone').classList.remove('active');
            if (e.dataTransfer.files.length) {
                handleFiles(e.dataTransfer.files);
            }
        });

        document.getElementById('fileDropZone').addEventListener('click', () => {
            document.getElementById('fileInput').click();
            document.getElementById('fileDropZone').classList.remove('active');
        });

        // === PWA INSTALLATION ===
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            const installBtn = document.getElementById('installBtn');
            if (installBtn) {
                installBtn.classList.add('show');
                installBtn.addEventListener('click', async () => {
                    installBtn.classList.remove('show');
                    deferredPrompt.prompt();
                    const result = await deferredPrompt.userChoice;
                    if (result.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        });
        
        window.addEventListener('appinstalled', () => {
            document.getElementById('installBtn')?.classList.remove('show');
            console.log('PWA installed successfully');
        });

        // === INIT ===
        addSystemMessage(`👋 Welcome! I'm your AI Memory Bot.`);
        addSystemMessage(`💾 Your data is stored in Telegram's unlimited cloud storage.`);
        addSystemMessage(`📤 Swipe left to delete from chat, right to delete permanently from Telegram.`);
        addSystemMessage(`📁 Upload any file and I'll remember it.`);
        
        setTimeout(refreshStorage, 1000);

        console.log('🧠 AI Memory Bot initialized');
        console.log(`👤 User ID: ${state.userId}`);
    </script>
    
    <!-- Install Button -->
    <button id="installBtn">📲 Install App</button>
</body>
</html>
