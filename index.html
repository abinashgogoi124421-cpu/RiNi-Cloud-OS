<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Memory Bot">
    <meta name="application-name" content="AI Memory Bot">
    <meta name="description" content="Personal AI with unlimited memory storage">
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/3767/3767084.png">
    
    <title>AI Memory Bot</title>
    
    <!-- Puter.js -->
    <script src="https://cdn.jsdelivr.net/npm/puter.js"></script>
    
    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ============================================
           APP CONTAINER
           ============================================ */
        .app {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            position: relative;
        }

        @media (min-width: 768px) {
            .app {
                max-width: 700px;
                margin: 0 auto;
                box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
                border-left: 1px solid #30363d;
                border-right: 1px solid #30363d;
            }
        }

        /* ============================================
           HEADER (ChatGPT Style)
           ============================================ */
        .header {
            padding: 12px 20px;
            background: rgba(22, 27, 34, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            min-height: 56px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            padding: 4px;
        }

        .header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #8b949e;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2ea043;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .header-right button {
            background: none;
            border: none;
            color: #8b949e;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            border-radius: 6px;
        }

        .header-right button:hover {
            color: #e6edf3;
            background: #30363d;
        }

        .header-right button:active {
            transform: scale(0.92);
        }

        /* ============================================
           CHAT AREA
           ============================================ */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 2px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* ============================================
           MESSAGES (ChatGPT Style)
           ============================================ */
        .message {
            max-width: 88%;
            padding: 10px 16px;
            border-radius: 12px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            transition: all 0.25s ease;
            word-wrap: break-word;
            line-height: 1.6;
        }

        .message.user {
            background: #1c2333;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid #30363d;
        }

        .message.ai {
            background: transparent;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            padding: 10px 0;
            max-width: 92%;
        }

        .message.system {
            background: transparent;
            align-self: center;
            color: #8b949e;
            font-size: 12px;
            padding: 4px 12px;
            max-width: 100%;
            text-align: center;
        }

        .message .timestamp {
            font-size: 10px;
            color: #484f58;
            margin-top: 6px;
            text-align: right;
            opacity: 0.7;
        }

        .message-content {
            font-size: 15px;
        }

        /* Rich Text Formatting */
        .message-content strong { color: #58a6ff; }
        .message-content em { color: #f0883e; }
        .message-content del { color: #f85149; text-decoration: line-through; }
        .message-content code {
            background: #161b22;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #f0883e;
        }
        .message-content pre {
            background: #161b22;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid #30363d;
        }
        .message-content pre code {
            background: none;
            padding: 0;
            color: #e6edf3;
            font-size: 13px;
        }
        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 13px;
        }
        .message-content th,
        .message-content td {
            border: 1px solid #30363d;
            padding: 6px 10px;
            text-align: left;
        }
        .message-content th {
            background: #161b22;
            color: #58a6ff;
        }
        .message-content ul,
        .message-content ol {
            padding-left: 20px;
            margin: 4px 0;
        }
        .message-content ul li,
        .message-content ol li {
            margin: 2px 0;
        }
        .message-content blockquote {
            border-left: 3px solid #58a6ff;
            padding-left: 12px;
            margin: 8px 0;
            color: #8b949e;
        }

        /* ============================================
           FILE DISPLAY IN CHAT
           ============================================ */
        .file-display {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .file-display:hover {
            border-color: #58a6ff;
        }

        .file-display .file-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-display .file-icon {
            font-size: 28px;
            width: 40px;
            text-align: center;
            flex-shrink: 0;
        }

        .file-display .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-display .file-name {
            font-size: 14px;
            color: #e6edf3;
            font-weight: 500;
            word-break: break-all;
        }

        .file-display .file-meta {
            font-size: 11px;
            color: #8b949e;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .file-display .file-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #21262d;
            color: #8b949e;
        }

        .file-display .file-badge.text {
            background: #1a3a2a;
            color: #2ea043;
        }

        .file-display .file-badge.binary {
            background: #3a1a1a;
            color: #f85149;
        }

        .file-display .file-content-preview {
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0 0;
            font-size: 13px;
            color: #8b949e;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #21262d;
        }

        .file-display .file-content-preview::-webkit-scrollbar {
            width: 3px;
        }

        .file-display .file-content-preview::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 2px;
        }

        .file-display .file-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .file-display .file-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .file-display .file-actions button.download {
            background: #1f6feb;
            color: white;
        }

        .file-display .file-actions button.download:hover {
            background: #388bfd;
            transform: scale(1.02);
        }

        .file-display .file-actions button.delete {
            background: #21262d;
            color: #f85149;
        }

        .file-display .file-actions button.delete:hover {
            background: #3a1a1a;
        }

        .file-display .file-actions button.download:active,
        .file-display .file-actions button.delete:active {
            transform: scale(0.95);
        }

        /* ============================================
           TYPING INDICATOR
           ============================================ */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 16px;
            background: transparent;
            gap: 4px;
            margin: 4px 0;
        }

        .typing-indicator.show {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        .typing-indicator .dot {
            width: 8px;
            height: 8px;
            background: #8b949e;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; max-height: 500px; margin: 2px 0; }
            to { transform: translateX(-100%); opacity: 0; max-height: 0; margin: 0; padding: 0; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; max-height: 500px; margin: 2px 0; }
            to { transform: translateX(100%); opacity: 0; max-height: 0; margin: 0; padding: 0; }
        }

        .message.swipe-left {
            animation: slideOutLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message.swipe-right {
            animation: slideOutRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ============================================
           INPUT AREA
           ============================================ */
        .input-area {
            padding: 8px 16px 16px;
            background: rgba(22, 27, 34, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid #30363d;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 4px;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .input-wrapper textarea {
            flex: 1;
            background: none;
            border: none;
            padding: 8px 12px;
            color: #e6edf3;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 20px;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder {
            color: #484f58;
        }

        .input-actions {
            display: flex;
            gap: 4px;
            padding: 4px;
            align-items: center;
        }

        .input-actions button {
            background: none;
            border: none;
            color: #8b949e;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .input-actions button:hover {
            color: #e6edf3;
            background: #30363d;
        }

        .input-actions button:active {
            transform: scale(0.92);
        }

        .input-actions button.send {
            background: #1f6feb;
            color: white;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 16px;
        }

        .input-actions button.send:hover {
            background: #388bfd;
            transform: scale(1.02);
        }

        .input-actions button.send:active {
            transform: scale(0.95);
        }

        .input-actions button.send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           DROP ZONE
           ============================================ */
        .drop-zone {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 17, 23, 0.92);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 1000;
            border: 3px dashed #30363d;
            margin: 20px;
            border-radius: 20px;
            animation: fadeIn 0.3s ease;
        }

        .drop-zone.active {
            display: flex;
        }

        .drop-zone .icon {
            font-size: 64px;
            opacity: 0.7;
        }
        .drop-zone .text {
            font-size: 20px;
            color: #8b949e;
        }
        .drop-zone .sub {
            font-size: 14px;
            color: #484f58;
        }

        /* ============================================
           INSTALL BUTTON
           ============================================ */
        #installBtn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f6feb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(31, 111, 235, 0.4);
            display: none;
            animation: pulse 2s infinite;
        }

        #installBtn.show {
            display: block;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 600px) {
            .message {
                max-width: 92%;
                padding: 8px 12px;
                font-size: 14px;
            }
            .message.ai {
                max-width: 95%;
            }
            .header {
                padding: 10px 14px;
                min-height: 48px;
            }
            .header h1 {
                font-size: 14px;
            }
            .chat-area {
                padding: 12px 14px 4px;
            }
            .input-area {
                padding: 6px 12px 12px;
            }
            .file-display {
                padding: 10px 12px;
            }
            .file-display .file-icon {
                font-size: 22px;
                width: 32px;
            }
            .file-display .file-name {
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .header-status span:not(.status-dot) {
                display: none;
            }
            .file-display .file-meta {
                font-size: 10px;
                gap: 6px;
            }
            .file-display .file-actions button {
                font-size: 11px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    APP
    ============================================ -->
    <div class="app" id="app">
        
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="avatar">
                    <img src="https://cdn-icons-png.flaticon.com/512/3767/3767084.png" alt="Memory Bot">
                </div>
                <div class="header-info">
                    <h1>AI Memory Bot</h1>
                    <div class="header-status">
                        <span class="status-dot"></span>
                        <span id="statusText">Ready</span>
                        <span style="color: #484f58; margin-left: 4px;">•</span>
                        <span id="fileCount" style="color: #484f58; font-size: 10px;">0 files</span>
                        <span style="color: #484f58; margin-left: 4px;">•</span>
                        <span id="memoryCount" style="color: #484f58; font-size: 10px;">0 memories</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button onclick="refreshData()" title="Refresh" id="refreshBtn">🔄</button>
                <button onclick="clearChat()" title="Clear chat">🗑️</button>
                <button onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- Messages appear here -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Ask me anything..." 
                          onkeydown="handleInputKeydown(event)"></textarea>
                <div class="input-actions">
                    <button onclick="document.getElementById('fileInput').click()" title="Upload file(s)">📎</button>
                    <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>

        <!-- Hidden file input -->
        <input type="file" id="fileInput" style="display:none" multiple 
               onchange="handleFiles(this.files)">

        <!-- Drop Zone -->
        <div class="drop-zone" id="dropZone">
            <div class="icon">📁</div>
            <div class="text">Drop files here</div>
            <div class="sub">or click to browse</div>
        </div>
    </div>

    <!-- Install Button -->
    <button id="installBtn">📲 Install App</button>

    <!-- ============================================
    JAVASCRIPT - COMPLETE APPLICATION
    ============================================ -->
   <script>
    // ============================================
    //  WAIT FOR PUTER.JS TO LOAD
    // ============================================
    let puterReady = false;
    let puterInitAttempts = 0;
    const MAX_ATTEMPTS = 10;

    function waitForPuter() {
        return new Promise((resolve, reject) => {
            function checkPuter() {
                if (typeof puter !== 'undefined' && puter.ai) {
                    console.log('✅ Puter.js loaded successfully');
                    resolve();
                    return;
                }
                
                puterInitAttempts++;
                if (puterInitAttempts > MAX_ATTEMPTS) {
                    reject(new Error('Puter.js failed to load after ' + MAX_ATTEMPTS + ' attempts'));
                    return;
                }
                
                console.log(`⏳ Waiting for Puter.js... (attempt ${puterInitAttempts})`);
                setTimeout(checkPuter, 500);
            }
            
            checkPuter();
        });
    }

    // ============================================
    //  CONFIGURATION
    // ============================================
    const CONFIG = {
        telegram: {
            channelId: '-1003953146702',
            botToken: '8835604359:AAFDVBTEXWb7lwQsSMynshd3HNoOM8dG-3E',
            baseUrl: 'https://api.telegram.org/bot8835604359:AAFDVBTEXWb7lwQsSMynshd3HNoOM8dG-3E'
        },
        textExtensions: ['txt', 'json', 'csv', 'md', 'xml', 'html', 'htm', 'css', 'js', 
                        'py', 'java', 'cpp', 'c', 'rb', 'go', 'rs', 'swift', 'kt', 
                        'php', 'sh', 'bash', 'zsh', 'fish', 'ps1', 'bat', 'cmd',
                        'yml', 'yaml', 'toml', 'ini', 'cfg', 'conf', 'log']
    };

    // ============================================
    //  STATE
    // ============================================
    const state = {
        userId: localStorage.getItem('memory_bot_user_id') || null,
        sessionId: 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        messages: [],
        files: [],
        isProcessing: false,
        messageCounter: 0,
        isLoggedIn: false,
        firstMessage: true,
        puterLoaded: false
    };

    // ============================================
    //  USER MANAGEMENT
    // ============================================
    function generateUserId() {
        const array = new Uint8Array(16);
        crypto.getRandomValues(array);
        return 'user_' + Array.from(array, byte => 
            byte.toString(16).padStart(2, '0')
        ).join('');
    }

    function getUserId() {
        if (!state.userId) {
            state.userId = generateUserId();
            localStorage.setItem('memory_bot_user_id', state.userId);
        }
        return state.userId;
    }

    // ============================================
    //  TELEGRAM STORAGE CLASS
    // ============================================
    class TelegramStorage {
        constructor() {
            this.channelId = CONFIG.telegram.channelId;
            this.baseUrl = CONFIG.telegram.baseUrl;
            this.userId = getUserId();
        }

        async sendMessage(text) {
            try {
                const response = await fetch(`${this.baseUrl}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: this.channelId,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
                const data = await response.json();
                if (!data.ok) throw new Error(data.description || 'Failed to send');
                return data;
            } catch (error) {
                console.error('Send error:', error);
                throw error;
            }
        }

        async deleteMessage(messageId) {
            try {
                const response = await fetch(`${this.baseUrl}/deleteMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: this.channelId,
                        message_id: parseInt(messageId)
                    })
                });
                return await response.json();
            } catch (error) {
                console.error('Delete error:', error);
                return null;
            }
        }

        async getUpdates() {
            try {
                const response = await fetch(`${this.baseUrl}/getUpdates`, {
                    method: 'GET'
                });
                const data = await response.json();
                return data.result || [];
            } catch (error) {
                console.error('Get updates error:', error);
                return [];
            }
        }

        async storeMemory(message, response) {
            try {
                const data = {
                    user: this.userId,
                    message: message,
                    response: response,
                    timestamp: new Date().toISOString()
                };
                const encrypted = await this.encrypt(JSON.stringify(data));
                const result = await this.sendMessage(
                    `🧠 MEMORY_${this.userId}_${Date.now()}\n${encrypted}`
                );
                return result?.result?.message_id;
            } catch (error) {
                console.error('Store memory error:', error);
                return null;
            }
        }

        async storeFile(file, content) {
            try {
                const isText = this.isTextFile(file.name);
                const storedContent = isText ? content : await this.fileToBase64(content);
                const fileType = file.name.split('.').pop().toLowerCase();
                
                const result = await this.sendMessage(
                    `📁 FILE_${this.userId}_${file.name}_${Date.now()}\n` +
                    `TYPE:${fileType}\n` +
                    `TEXT:${isText}\n` +
                    `SIZE:${file.size}\n` +
                    `\n${storedContent}`
                );
                return result?.result?.message_id;
            } catch (error) {
                console.error('Store file error:', error);
                return null;
            }
        }

        async getAllUserMessages() {
            try {
                const updates = await this.getUpdates();
                const userMessages = updates.filter(msg => {
                    const text = msg.message?.text || '';
                    return text.includes(`_${this.userId}_`);
                });
                return userMessages;
            } catch (error) {
                console.error('Get user messages error:', error);
                return [];
            }
        }

        async getMemories() {
            const messages = await this.getAllUserMessages();
            return messages.filter(msg => 
                msg.message?.text?.includes('🧠 MEMORY_')
            );
        }

        async getFiles() {
            const messages = await this.getAllUserMessages();
            return messages.filter(msg => 
                msg.message?.text?.includes('📁 FILE_')
            );
        }

        isTextFile(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return CONFIG.textExtensions.includes(ext);
        }

        async encrypt(data) {
            let encrypted = '';
            for (let i = 0; i < data.length; i++) {
                encrypted += String.fromCharCode(data.charCodeAt(i) ^ this.userId.length);
            }
            return btoa(encrypted);
        }

        async decrypt(encrypted) {
            try {
                const decoded = atob(encrypted);
                let decrypted = '';
                for (let i = 0; i < decoded.length; i++) {
                    decrypted += String.fromCharCode(decoded.charCodeAt(i) ^ this.userId.length);
                }
                return decrypted;
            } catch {
                return encrypted;
            }
        }

        async fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

        async extractFileContent(messageText) {
            const lines = messageText.split('\n');
            const contentStart = lines.findIndex(l => l.trim() === '');
            if (contentStart !== -1) {
                return lines.slice(contentStart + 1).join('\n');
            }
            return '';
        }

        parseFileMessage(messageText) {
            const lines = messageText.split('\n');
            const result = {
                type: 'file',
                filename: '',
                fileType: '',
                isText: false,
                size: 0,
                content: '',
                messageId: null
            };

            const fileMatch = messageText.match(/FILE_.+?_(.+?)_/);
            if (fileMatch) {
                result.filename = fileMatch[1];
            }

            for (const line of lines) {
                if (line.startsWith('TYPE:')) {
                    result.fileType = line.replace('TYPE:', '').trim();
                }
                if (line.startsWith('TEXT:')) {
                    result.isText = line.replace('TEXT:', '').trim() === 'true';
                }
                if (line.startsWith('SIZE:')) {
                    result.size = parseInt(line.replace('SIZE:', '').trim()) || 0;
                }
            }

            const contentStart = lines.findIndex(l => l.trim() === '');
            if (contentStart !== -1) {
                result.content = lines.slice(contentStart + 1).join('\n');
            }

            return result;
        }
    }

    const storage = new TelegramStorage();

    //  UI HELPERS
    // ============================================
    function addMessage(type, content, metadata = {}) {
        const area = document.getElementById('chatArea');
        const messageId = ++state.messageCounter;
        
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.dataset.messageId = messageId;
        div.dataset.telegramId = metadata.telegramId || '';

        let formattedContent = content;
        if (type === 'ai' || type === 'user') {
            formattedContent = formatText(content);
        }

        let html = `<div class="message-content">${formattedContent}</div>`;

        if (metadata.files && metadata.files.length > 0) {
            for (const file of metadata.files) {
                html += renderFileDisplay(file);
            }
        }

        if (metadata.timestamp) {
            html += `<div class="timestamp">${metadata.timestamp}</div>`;
        }

        div.innerHTML = html;
        
        setupSwipeHandlers(div);
        
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
        
        state.messages.push({ id: messageId, type, content, metadata });
        return div;
    }

    function renderFileDisplay(file) {
        const isText = file.isText !== undefined ? file.isText : storage.isTextFile(file.filename);
        const icon = isText ? '📄' : '📎';
        const typeLabel = isText ? 'Text file' : 'Binary file';
        const badgeClass = isText ? 'text' : 'binary';
        const badgeText = isText ? '📝 AI can read' : '🔒 AI cannot read';
        
        let previewHtml = '';
        if (isText && file.content && file.content.length > 0) {
            const preview = file.content.substring(0, 300) + (file.content.length > 300 ? '...' : '');
            previewHtml = `<div class="file-content-preview">${escapeHtml(preview)}</div>`;
        }

        return `
            <div class="file-display" data-filename="${file.filename}">
                <div class="file-header">
                    <span class="file-icon">${icon}</span>
                    <div class="file-info">
                        <div class="file-name">${escapeHtml(file.filename)}</div>
                        <div class="file-meta">
                            <span>${typeLabel}</span>
                            <span>• ${formatFileSize(file.size || 0)}</span>
                            <span class="file-badge ${badgeClass}">${badgeText}</span>
                        </div>
                    </div>
                </div>
                ${previewHtml}
                <div class="file-actions">
                    <button class="download" onclick="downloadFile('${escapeHtml(file.filename)}')">
                        ⬇️ Download
                    </button>
                    <button class="delete" onclick="deleteFilePermanent('${escapeHtml(file.filename)}')">
                        🗑️ Delete
                    </button>
                </div>
            </div>
        `;
    }

    function formatText(text) {
        let html = text;
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        html = html.replace(/\|(.+)\|/g, (match) => {
            const cells = match.split('|').filter(c => c.trim());
            return `<table><tr>${cells.map(c => `<td>${c.trim()}</td>`).join('')}</tr></table>`;
        });
        html = html.replace(/^- (.*?)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*?<\/li>)/gs, (match) => {
            return `<ul>${match}</ul>`;
        });
        html = html.replace(/^> (.*?)$/gm, '<blockquote>$1</blockquote>');
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
    }

    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'message system';
        div.textContent = text;
        document.getElementById('chatArea').appendChild(div);
        document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;

    // ============================================
    //  SWIPE HANDLERS
    // ============================================
    function setupSwipeHandlers(element) {
        let startX = 0, startY = 0;
        let isSwiping = false;

        element.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = false;
            element.style.transition = 'none';
        }, { passive: true });

        element.addEventListener('touchmove', (e) => {
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;
            
            if (Math.abs(deltaY) > 20) return;
            if (Math.abs(deltaX) < 10) return;
            
            isSwiping = true;
            e.preventDefault();

            const progress = Math.min(Math.abs(deltaX) / 100, 1);
            element.style.transform = `translateX(${deltaX}px)`;
            element.style.opacity = 1 - progress * 0.4;
            
            if (deltaX < -30) {
                element.style.borderLeft = `3px solid #f85149`;
            } else if (deltaX > 30) {
                element.style.borderRight = `3px solid #f0883e`;
            } else {
                element.style.border = '';
            }
        }, { passive: false });

        element.addEventListener('touchend', (e) => {
            const deltaX = e.changedTouches[0].clientX - startX;
            element.style.transition = 'all 0.25s ease';
            
            if (!isSwiping) return;

            if (deltaX < -60) {
                deleteMessageLocal(element);
            } else if (deltaX > 60) {
                deleteMessagePermanent(element);
            } else {
                element.style.transform = '';
                element.style.opacity = '';
                element.style.border = '';
            }
        }, { passive: true });

        let mouseDown = false;
        let mouseStartX = 0;

        element.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouseDown = true;
                mouseStartX = e.clientX;
                element.style.transition = 'none';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const deltaX = e.clientX - mouseStartX;
            if (Math.abs(deltaX) > 10) {
                element.style.transform = `translateX(${deltaX}px)`;
                element.style.opacity = 1 - Math.min(Math.abs(deltaX) / 100, 0.4);
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (!mouseDown) return;
            mouseDown = false;
            element.style.transition = 'all 0.25s ease';
            const deltaX = e.clientX - mouseStartX;
            
            if (deltaX < -60) {
                deleteMessageLocal(element);
            } else if (deltaX > 60) {
                deleteMessagePermanent(element);
            } else {
                element.style.transform = '';
                element.style.opacity = '';
            }
        });
    }

    // ============================================
    //  DELETE FUNCTIONS
    // ============================================
    function deleteMessageLocal(element) {
        element.classList.add('swipe-left');
        setTimeout(() => {
            element.remove();
            const id = parseInt(element.dataset.messageId);
            state.messages = state.messages.filter(m => m.id !== id);
        }, 350);
    }

    async function deleteMessagePermanent(element) {
        const telegramId = element.dataset.telegramId;
        if (telegramId) {
            await storage.deleteMessage(telegramId);
            addSystemMessage('🗑️ Message deleted from Telegram permanently');
        }
        element.classList.add('swipe-right');
        setTimeout(() => {
            element.remove();
            const id = parseInt(element.dataset.messageId);
            state.messages = state.messages.filter(m => m.id !== id);
        }, 350);
        await refreshData();
    }

    // ============================================
    //  FILE FUNCTIONS
    // ============================================
    async function handleFiles(files) {
        const fileArray = Array.from(files);
        if (fileArray.length === 0) return;

        updateStatus(`Uploading ${fileArray.length} file(s)...`);
        showTyping(true);

        try {
            for (const file of fileArray) {
                const isText = storage.isTextFile(file.name);
                let content = file;

                if (isText) {
                    content = await file.text();
                }

                const messageId = await storage.storeFile(file, content);
                
                const fileData = {
                    filename: file.name,
                    size: file.size,
                    isText: isText,
                    content: isText ? content : null,
                    messageId: messageId
                };

                addMessage('system', `📁 Uploaded file:`, {
                    files: [fileData],
                    telegramId: messageId,
                    timestamp: new Date().toLocaleTimeString()
                });

                if (isText && content.length > 0) {
                    await sendMessageToAI(`I uploaded a text file named "${file.name}". Here's its content:\n\n${content}\n\nPlease remember this file and its content.`);
                }
            }

            await refreshData();
            updateStatus('Ready');
        } catch (error) {
            addSystemMessage(`❌ Error uploading files: ${error.message}`);
            updateStatus('Error');
        } finally {
            showTyping(false);
            document.getElementById('fileInput').value = '';
        }
    }

    async function downloadFile(filename) {
        addSystemMessage(`⏳ Searching for "${filename}"...`);
        updateStatus('Downloading...');

        try {
            const files = await storage.getFiles();
            let found = false;

            for (const msg of files) {
                const text = msg.message?.text || '';
                if (text.includes(filename)) {
                    const fileData = storage.parseFileMessage(text);
                    fileData.messageId = msg.message.message_id;
                    
                    if (fileData.content) {
                        if (fileData.isText) {
                            const blob = new Blob([fileData.content], { type: 'text/plain' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                            addSystemMessage(`✅ Downloaded "${filename}"`);
                        } else {
                            try {
                                const binary = atob(fileData.content);
                                const byteArray = new Uint8Array(binary.length);
                                for (let i = 0; i < binary.length; i++) {
                                    byteArray[i] = binary.charCodeAt(i);
                                }
                                const blob = new Blob([byteArray]);
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = filename;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                                addSystemMessage(`✅ Downloaded "${filename}"`);
                            } catch (e) {
                                addSystemMessage(`❌ Could not download "${filename}"`);
                            }
                        }
                        found = true;
                        break;
                    }
                }
            }

            if (!found) {
                addSystemMessage(`❌ File "${filename}" not found`);
            }
        } catch (error) {
            addSystemMessage(`❌ Error downloading: ${error.message}`);
        } finally {
            updateStatus('Ready');
        }
    }

    async function deleteFilePermanent(filename) {
        if (!confirm(`Delete "${filename}" permanently?`)) return;

        try {
            const files = await storage.getFiles();
            let deleted = false;

            for (const msg of files) {
                const text = msg.message?.text || '';
                if (text.includes(filename)) {
                    await storage.deleteMessage(msg.message.message_id);
                    deleted = true;
                }
            }

            if (deleted) {
                addSystemMessage(`🗑️ Deleted "${filename}" from storage`);
                await refreshData();
            } else {
                addSystemMessage(`❌ File "${filename}" not found`);
            }
        } catch (error) {
            addSystemMessage(`❌ Error deleting: ${error.message}`);
        }
    }

    // ============================================
    //  AI FUNCTIONS (FIXED - with Puter check)
    // ============================================
    async function sendMessageToAI(message) {
        if (state.isProcessing) return;
        
        // Check if Puter is ready
        if (typeof puter === 'undefined' || !puter.ai) {
            addSystemMessage('⏳ AI is loading... Please wait a moment.');
            return;
        }
        
        state.isProcessing = true;
        document.getElementById('sendBtn').disabled = true;

        showTyping(true);
        updateStatus('AI thinking...');

        try {
            const context = await getContext();
            const fullPrompt = context + '\n\nUser: ' + message;
            
            const response = await puter.ai.chat(fullPrompt, {
                model: 'gpt-4o-mini',
                temperature: 0.7
            });

            await storage.storeMemory(message, response);

            addMessage('ai', response, {
                timestamp: new Date().toLocaleTimeString()
            });

            await handleFileRequest(message, response);

        } catch (error) {
            console.error('AI Error:', error);
            if (error.message && error.message.toLowerCase().includes('login')) {
                addSystemMessage('🔐 Please log in to use the AI. Check the popup window.');
                updateStatus('Not logged in');
            } else {
                addSystemMessage(`❌ Error: ${error.message || 'AI not available'}`);
                updateStatus('Error');
            }
        } finally {
            state.isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
            showTyping(false);
            updateStatus('Ready');
            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
        }
    }

    async function getContext() {
        try {
            const memories = await storage.getMemories();
            const recentMemories = memories.slice(-10);
            let context = 'You are a personal AI assistant with perfect memory. ';
            context += 'You remember all previous conversations and can learn from them.\n\n';
            context += 'Previous conversations:\n';

            for (const mem of recentMemories) {
                const text = mem.message?.text || '';
                const encrypted = text.split('\n')[1] || '';
                if (encrypted) {
                    try {
                        const decrypted = await storage.decrypt(encrypted);
                        const data = JSON.parse(decrypted);
                        context += `User: ${data.message}\nAI: ${data.response}\n`;
                    } catch (e) {
                        // Skip if can't decrypt
                    }
                }
            }

            return context;
        } catch (error) {
            console.error('Context error:', error);
            return 'You are a personal AI assistant with perfect memory.';
        }
    }

    async function handleFileRequest(message, response) {
        const filePatterns = [
            /file/i, /document/i, /spreadsheet/i, /pdf/i, /image/i,
            /give me/i, /download/i, /show me/i, /find/i
        ];

        const hasFileRequest = filePatterns.some(pattern => 
            pattern.test(message) || pattern.test(response)
        );

        if (hasFileRequest) {
            const words = (message + ' ' + response).split(/\s+/);
            let possibleFilename = null;

            for (const word of words) {
                if (word.includes('.') && !word.includes('http') && !word.includes('https')) {
                    possibleFilename = word;
                    break;
                }
            }

            if (possibleFilename) {
                await downloadFile(possibleFilename);
            } else {
                await listFiles();
            }
        }
    }

    // ============================================
    //  LIST FILES
    // ============================================
    async function listFiles() {
        try {
            const files = await storage.getFiles();
            if (files.length === 0) {
                addSystemMessage('📭 No files found in storage.');
                return;
            }

            const fileList = [];
            for (const msg of files) {
                const text = msg.message?.text || '';
                const fileData = storage.parseFileMessage(text);
                if (fileData.filename) {
                    fileList.push(fileData);
                }
            }

            if (fileList.length > 0) {
                let message = `📁 Found ${fileList.length} file(s):\n\n`;
                for (const file of fileList) {
                    const type = file.isText ? '📄 Text' : '📎 Binary';
                    message += `• ${file.filename} (${type}, ${formatFileSize(file.size)})\n`;
                }
                addMessage('ai', message, {
                    timestamp: new Date().toLocaleTimeString()
                });
            }
        } catch (error) {
            addSystemMessage(`❌ Error listing files: ${error.message}`);
        }
    }

    // ============================================
    //  SEND MESSAGE
    // ============================================
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        
        if (!text || state.isProcessing) return;
        
        if (text.toLowerCase().includes('list files') || text.toLowerCase().includes('show files')) {
            addMessage('user', text, {
                timestamp: new Date().toLocaleTimeString()
            });
            input.value = '';
            input.style.height = 'auto';
            await listFiles();
            return;
        }

        if (text.toLowerCase().includes('download') || text.toLowerCase().includes('give me')) {
            const match = text.match(/(?:download|give me|get)\s+(?:the\s+file\s+)?['"]?([^'"\s]+)['"]?/i);
            if (match && match[1]) {
                addMessage('user', text, {
                    timestamp: new Date().toLocaleTimeString()
                });
                input.value = '';
                input.style.height = 'auto';
                await downloadFile(match[1]);
                return;
            }
        }

        addMessage('user', text, {
            timestamp: new Date().toLocaleTimeString()
        });
        
        input.value = '';
        input.style.height = 'auto';
        
        await sendMessageToAI(text);
    }

    // ============================================
    //  THEME TOGGLE
    // ============================================
    function toggleTheme() {
        const isDark = document.body.style.background !== '#f0f6fc';
        document.body.style.background = isDark ? '#f0f6fc' : '#0d1117';
        document.body.style.color = isDark ? '#24292f' : '#e6edf3';
        document.querySelector('.app').style.background = isDark ? '#f6f8fa' : '#0d1117';
        document.querySelector('.header').style.background = isDark ? 'rgba(246,248,250,0.98)' : 'rgba(22,27,34,0.98)';
        document.querySelector('.input-area').style.background = isDark ? 'rgba(246,248,250,0.98)' : 'rgba(22,27,34,0.98)';
        document.querySelector('.input-wrapper').style.background = isDark ? '#f0f0f0' : '#161b22';
        document.querySelector('.input-wrapper textarea').style.color = isDark ? '#24292f' : '#e6edf3';
    }

    // ============================================
    //  DRAG AND DROP
    // ============================================
    document.addEventListener('dragover', (e) => {
        e.preventDefault();
        document.getElementById('dropZone').classList.add('active');
    });

    document.addEventListener('dragleave', (e) => {
        e.preventDefault();
        document.getElementById('dropZone').classList.remove('active');
    });

    document.addEventListener('drop', (e) => {
        e.preventDefault();
        document.getElementById('dropZone').classList.remove('active');
        if (e.dataTransfer.files.length) {
            handleFiles(e.dataTransfer.files);
        }
    });

    document.getElementById('dropZone').addEventListener('click', () => {
        document.getElementById('fileInput').click();
        document.getElementById('dropZone').classList.remove('active');
    });

    // ============================================
    //  PWA INSTALLATION
    // ============================================
    let deferredPrompt;
    
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        const installBtn = document.getElementById('installBtn');
        installBtn.classList.add('show');
        installBtn.addEventListener('click', async () => {
            installBtn.classList.remove('show');
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                console.log('PWA installed');
            }
            deferredPrompt = null;
        });
    });
    
    window.addEventListener('appinstalled', () => {
        document.getElementById('installBtn')?.classList.remove('show');
    });

    // ============================================
    //  ADD SPIN ANIMATION
    // ============================================
    const styleEl = document.createElement('style');
    styleEl.textContent = `
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    `;
    document.head.appendChild(styleEl);

    // ============================================
    //  INIT
    // ============================================
    async function init() {
        console.log('🧠 AI Memory Bot');
        console.log(`👤 User ID: ${getUserId()}`);
        console.log(`🔄 Session: ${state.sessionId}`);
        
        addSystemMessage('👋 Welcome to your AI Memory Bot!');
        addSystemMessage('💾 Your data is stored securely in Telegram.');
        addSystemMessage('📤 You can upload, download, and manage files.');
        addSystemMessage('🧠 The AI learns from every conversation.');
        
        // Wait for Puter.js to load
        try {
            await waitForPuter();
            state.puterLoaded = true;
            
            // Test AI connection
            try {
                await puter.ai.chat('Hello', { model: 'gpt-4o-mini' });
                state.isLoggedIn = true;
                addSystemMessage('✅ AI is ready!');
                updateStatus('Ready');
            } catch (error) {
                if (error.message && error.message.toLowerCase().includes('login')) {
                    addSystemMessage('🔐 Please log in to use the AI. A popup should appear.');
                    updateStatus('Login required');
                } else {
                    addSystemMessage('⚠️ AI error: ' + error.message);
                    updateStatus('Error');
                }
            }
        } catch (error) {
            addSystemMessage('⚠️ ' + error.message);
            addSystemMessage('🔄 Please refresh the page.');
            updateStatus('Error');
        }
        
        // Load data
        await refreshData();
        
        // Focus input
        document.getElementById('userInput').focus();
    }

    // Start the app
    init();

    // ============================================
    //  KEYBOARD SHORTCUTS
    // ============================================
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
            e.preventDefault();
            document.getElementById('userInput').focus();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
            e.preventDefault();
            refreshData();
        }
    });

    console.log('🚀 Shortcuts: Ctrl+L = focus input, Ctrl+R = refresh');
</script>
</body>
</html>
